[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyjaspar"
version = "5.0.0"
description = "pyJASPAR: a Pythonic interface to JASPAR transcription factor motifs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Aziz Khan", email = "azez.khan@gmail.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "biopython>=1.80",
    "rich-click>=1.7",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

[project.scripts]
pyjaspar = "pyjaspar.cli.main:cli"

[project.urls]
Homepage = "https://github.com/asntech/pyjaspar"
Documentation = "https://asntech.github.io/pyjaspar"
Repository = "https://github.com/asntech/pyjaspar"
Issues = "https://github.com/asntech/pyjaspar/issues"

[tool.hatch.build.targets.sdist]
include = [
    "src/pyjaspar/",
    "LICENSE",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyjaspar"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["pyjaspar"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "Bio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
